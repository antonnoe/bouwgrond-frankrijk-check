<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Bouwgrond-check Frankrijk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="font-family: Mulish, Arial, sans-serif; line-height:1.8; color:#111; background:#fff;">

<div style="max-width:920px;margin:0 auto;padding:16px;">

  <h1 style="color:#800000;">Bouwgrond-check Frankrijk</h1>

  <!-- Toggle -->
  <div style="margin:20px 0;padding:12px;border:1px solid #ddd;border-radius:6px;">
    <strong>Wat wil je doen?</strong><br><br>
    <label>
      <input type="radio" name="mode" value="local">
      Locatiespecifiek – kopen / checken
    </label><br>
    <label>
      <input type="radio" name="mode" value="reverse">
      Regionaal (reverse) – zoeken / vergelijken
    </label>
  </div>

  <!-- Invoer -->
  <div style="margin:20px 0;">
    <label for="loc" style="font-weight:bold;">Waar wil je bouwen?</label><br>
    <input id="loc" type="text" placeholder="Postcode of gemeente"
           style="padding:10px;width:100%;max-width:320px;">
    <br><br>
    <button id="checkBtn"
            style="padding:10px 16px;background:#800000;color:#fff;border:0;border-radius:4px;">
      Controleer
    </button>
  </div>

  <!-- Resultaat -->
  <div id="result"
       style="margin-top:30px;padding:16px;border:1px solid #ddd;border-radius:6px;display:none;">
  </div>

</div>

<!-- Koppeling met API -->
<script src="/api/embed.js"></script>

</body>
</html>
